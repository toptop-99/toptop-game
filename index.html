<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تۆپ تۆپ - گەمینگ هوب</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        html, body {
            width: 100vw; height: 100vh; margin: 0; padding: 0;
            background-color: #e62020; color: #f8fafc;
            font-family: 'Noto Sans Arabic', sans-serif;
            overflow: hidden; touch-action: manipulation;
        }
        .container {
            width: 100vw; height: 100vh;
            background: linear-gradient(180deg, #dc2626 0%, #991b1b 100%);
            display: flex; flex-direction: column; padding: 12px; position: relative; overflow: hidden;
        }
        
        /* Nav Header */
        .app-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 12px; background: rgba(0,0,0,0.25); border-radius: 16px;
            backdrop-filter: blur(10px); margin-bottom: 12px;
        }
        .brand-title {
            font-size: 22px; font-weight: 900; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.4);
            margin: 0;
        }
        
        .screen { display: none; flex: 1; flex-direction: column; height: 100%; overflow-y: auto; padding-bottom: 20px; }
        .screen.active { display: flex; }

        /* Form Controls */
        .card {
            background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(12px);
            border-radius: 20px; padding: 16px; margin-bottom: 12px;
            border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }
        .form-group { margin-bottom: 12px; text-align: right; }
        label { display: block; font-size: 12px; margin-bottom: 4px; color: #fef08a; font-weight: bold; }
        input {
            width: 100%; padding: 12px; background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.3); border-radius: 12px; color: #fff;
            font-size: 14px; outline: none; font-family: 'Noto Sans Arabic', sans-serif;
        }
        .btn {
            width: 100%; background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #78350f; border: none; padding: 12px; font-size: 15px;
            font-weight: 900; border-radius: 12px; cursor: pointer; margin-top: 6px;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4); transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.96); }
        .btn-secondary { background: rgba(0, 0, 0, 0.4); color: #fff; box-shadow: none; }
        .nav-back-btn {
            background: rgba(255,255,255,0.2); border: none; color: white;
            padding: 6px 12px; border-radius: 10px; font-weight: bold; cursor: pointer;
            display: flex; align-items: center; gap: 4px; font-size: 12px;
        }

        /* Top User Profile Panel */
        .hub-header-panel {
            background: rgba(0, 0, 0, 0.3); border-radius: 16px; padding: 10px 14px;
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
        }
        .hub-user-info { display: flex; align-items: center; gap: 10px; }
        .hub-avatar-box {
            width: 42px; height: 42px; border-radius: 50%; background: #f59e0b;
            display: flex; justify-content: center; align-items: center;
            font-size: 20px; border: 2px solid #fff; box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }
        .hub-coins-badge {
            background: rgba(255, 255, 255, 0.2); border: 1px solid rgba(255,255,255,0.4);
            padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; color: #fef08a;
            display: flex; align-items: center; gap: 4px;
        }

        /* --- PITO Style Games Grid --- */
        .games-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
            padding: 4px 0;
        }
        .game-card {
            position: relative; width: 100%; aspect-ratio: 3 / 4;
            border-radius: 18px; overflow: hidden;
            background: #1e293b; border: 2px solid rgba(255,255,255,0.2);
            box-shadow: 0 6px 16px rgba(0,0,0,0.3); cursor: pointer;
            transition: transform 0.2s ease; display: flex; flex-direction: column;
            justify-content: flex-end; padding: 8px; text-align: center;
        }
        .game-card:active { transform: scale(0.95); }
        .game-card-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1; filter: brightness(0.85);
        }
        .game-card-title {
            position: relative; z-index: 2; font-weight: 900; font-size: 13px;
            color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        }
        .fav-heart {
            position: absolute; top: 6px; right: 6px; z-index: 3;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(4px);
            width: 24px; height: 24px; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; font-size: 11px;
        }

        /* --- Shop Styling --- */
        .shop-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
        .shop-item {
            background: rgba(0,0,0,0.3); border-radius: 14px; padding: 12px;
            text-align: center; border: 1px solid rgba(255,255,255,0.15);
        }
        .shop-item-icon { font-size: 36px; margin-bottom: 6px; }

        /* --- Snakes & Ladders Board Styles --- */
        .snake-board {
            display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(10, 1fr);
            gap: 2px; background: #1e293b; border: 4px solid #f59e0b; border-radius: 12px;
            width: 100%; aspect-ratio: 1; padding: 4px; box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            position: relative;
        }
        .board-cell {
            background: rgba(255,255,255,0.9); border-radius: 4px; font-size: 8px;
            font-weight: bold; color: #334155; display: flex; justify-content: flex-start;
            align-items: flex-start; padding: 2px; position: relative;
        }
        .board-cell:nth-child(even) { background: #e2e8f0; }
        .player-token {
            width: 14px; height: 14px; border-radius: 50%; position: absolute;
            bottom: 2px; right: 2px; box-shadow: 0 0 4px rgba(0,0,0,0.5); z-index: 10;
        }
        .token-p1 { background: #ef4444; border: 1px solid #fff; }
        .token-p2 { background: #3b82f6; border: 1px solid #fff; }
        .dice-box {
            display: flex; justify-content: space-around; align-items: center;
            background: rgba(0,0,0,0.3); padding: 10px; border-radius: 14px; margin-top: 10px;
        }
        .dice-visual {
            width: 46px; height: 46px; background: #fff; border-radius: 10px;
            display: flex; justify-content: center; align-items: center; font-size: 24px;
            color: #0f172a; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Auth Screen -->
        <div id="authScreen" class="screen active">
            <div class="app-header">
                <h1 class="brand-title">🎮 تۆپ تۆپ</h1>
            </div>
            <div class="card">
                <div style="display:flex; gap:6px; margin-bottom:12px;">
                    <button class="btn" style="flex:1" onclick="switchAuthMode('login')">چوونەژوورەوە</button>
                    <button class="btn btn-secondary" style="flex:1" onclick="switchAuthMode('register')">حیسابی نوێ</button>
                </div>

                <div id="registerForm" style="display: none;">
                    <div class="form-group">
                        <label>ناوی بەکارهێنەر</label>
                        <input type="text" id="regUsername" placeholder="ناوی بەکارهێنەر...">
                    </div>
                    <div class="form-group">
                        <label>وشەی نهێنی</label>
                        <input type="password" id="regPassword" placeholder="وشەی نهێنی...">
                    </div>
                    <button class="btn" onclick="registerUser()">دروستکردنی حیساب</button>
                </div>

                <div id="loginForm">
                    <div class="form-group">
                        <label>ناوی بەکارهێنەر</label>
                        <input type="text" id="loginUsername" placeholder="ناوی بەکارهێنەر...">
                    </div>
                    <div class="form-group">
                        <label>وشەی نهێنی</label>
                        <input type="password" id="loginPassword" placeholder="وشەی نهێنی...">
                    </div>
                    <button class="btn" onclick="loginUser()">چوونەژوورەوە</button>
                </div>
            </div>
        </div>

        <!-- Hub Screen -->
        <div id="hubScreen" class="screen">
            <div class="app-header">
                <h1 class="brand-title">تۆپ تۆپ</h1>
                <button class="nav-back-btn" onclick="openShopScreen()">🛒 دوکان</button>
            </div>
            
            <div class="hub-header-panel">
                <div class="hub-user-info">
                    <div class="hub-avatar-box" id="hubUserAvatar">👤</div>
                    <div>
                        <span id="hubUsernameText" style="font-weight: bold; color: #fff; font-size: 14px;"></span>
                    </div>
                </div>
                <div class="hub-coins-badge">💰 <span id="hubTotalCoins">0</span></div>
            </div>

            <div style="margin-bottom: 8px; font-weight: bold; font-size: 13px;">🕹️ هەموو یارییەکان</div>

            <!-- PITO Style 3-Column Grid -->
            <div class="games-grid">
                
                <!-- Game 1: Snakes & Ladders -->
                <div class="game-card" onclick="openSnakeGameOption()">
                    <span class="fav-heart">❤️</span>
                    <img class="game-card-bg" src="https://images.unsplash.com/photo-1610890716171-6b1bb98ffd09?w=400" alt="مار و پێژە">
                    <span class="game-card-title">مار و پێژە</span>
                </div>

                <!-- Game 2: Chess -->
                <div class="game-card" onclick="alert('یاری شەتڕەنج لە بەشی نوێکردنەوەدایە!')">
                    <span class="fav-heart">🤍</span>
                    <img class="game-card-bg" src="https://images.unsplash.com/photo-1529699211952-734e80c4d42b?w=400" alt="شەتڕەنج">
                    <span class="game-card-title">شەتڕەنج</span>
                </div>

                <!-- Game 3: Fruits -->
                <div class="game-card" onclick="alert('یاری مێوەکان بەزوانە بەردەست دەبێت!')">
                    <span class="fav-heart">🤍</span>
                    <img class="game-card-bg" src="https://images.unsplash.com/photo-1619566636858-adf3ef46400b?w=400" alt="مێوەکان">
                    <span class="game-card-title">مێوەکان</span>
                </div>

                <!-- Game 4: Ludo -->
                <div class="game-card" onclick="alert('لودۆ بەزوانە بەردەست دەبێت!')">
                    <span class="fav-heart">🤍</span>
                    <img class="game-card-bg" src="https://images.unsplash.com/photo-1563986768609-322da13575f3?w=400" alt="لودۆ">
                    <span class="game-card-title">لودۆ</span>
                </div>

                <!-- Game 5: Mafia -->
                <div class="game-card" onclick="alert('یاری مافیا بەزوانە بەردەست دەبێت!')">
                    <span class="fav-heart">🤍</span>
                    <img class="game-card-bg" src="https://images.unsplash.com/photo-1511193311914-0346f16efe90?w=400" alt="مافیا">
                    <span class="game-card-title">مافیا</span>
                </div>

                <!-- Game 6: Cards -->
                <div class="game-card" onclick="alert('کارتەکان بەزوانە بەردەست دەبێت!')">
                    <span class="fav-heart">🤍</span>
                    <img class="game-card-bg" src="https://images.unsplash.com/photo-1541278107931-e006523892df?w=400" alt="کارت">
                    <span class="game-card-title">پاسۆر</span>
                </div>

            </div>
        </div>

        <!-- Shop Screen -->
        <div id="shopScreen" class="screen">
            <div class="app-header">
                <button class="nav-back-btn" onclick="switchScreen('hubScreen')">🏠 سەرەتا</button>
                <h1 class="brand-title">🛒 دوکانی تۆپ تۆپ</h1>
            </div>

            <div class="card">
                <div style="font-weight: bold; font-size: 14px; text-align: center;">کڕینی ئاڤاتاری بەهێز</div>
                <div class="shop-grid">
                    <div class="shop-item">
                        <div class="shop-item-icon">🦁</div>
                        <div style="font-weight: bold; font-size: 12px;">شێر (Lion)</div>
                        <button class="btn" style="font-size: 11px; padding: 6px;" onclick="buyAvatar('🦁', 50)">💰 50</button>
                    </div>
                    <div class="shop-item">
                        <div class="shop-item-icon">👑</div>
                        <div style="font-weight: bold; font-size: 12px;">تاج (King)</div>
                        <button class="btn" style="font-size: 11px; padding: 6px;" onclick="buyAvatar('👑', 100)">💰 100</button>
                    </div>
                    <div class="shop-item">
                        <div class="shop-item-icon">🥷</div>
                        <div style="font-weight: bold; font-size: 12px;">نینجا (Ninja)</div>
                        <button class="btn" style="font-size: 11px; padding: 6px;" onclick="buyAvatar('🥷', 150)">💰 150</button>
                    </div>
                    <div class="shop-item">
                        <div class="shop-item-icon">🚀</div>
                        <div style="font-weight: bold; font-size: 12px;">مەکۆ (Rocket)</div>
                        <button class="btn" style="font-size: 11px; padding: 6px;" onclick="buyAvatar('🚀', 200)">💰 200</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Snake & Ladders Screen -->
        <div id="snakeGameScreen" class="screen">
            <div class="app-header">
                <button class="nav-back-btn" onclick="switchScreen('hubScreen')">🏠 سەرەتا</button>
                <span id="snakeTurnText" style="font-size: 12px; font-weight: bold; color: #fef08a;">نۆرەی تۆیە!</span>
            </div>

            <div class="card" style="padding: 8px;">
                <div class="snake-board" id="snakeBoard"></div>
            </div>

            <div class="dice-box">
                <div>
                    <div style="font-size: 12px; color: #fef08a;">تۆ: خانەی <span id="p1PosText">1</span></div>
                    <div style="font-size: 12px; color: #60a5fa;">ڕکابەر: خانەی <span id="p2PosText">1</span></div>
                </div>
                <div class="dice-visual" id="diceDisplay">🎲</div>
                <button class="btn" style="width: auto; padding: 10px 20px;" id="rollDiceBtn" onclick="rollSnakeDice()">هاوێشتنی زار</button>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
      import { getFirestore, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDfrFkglZShCuZhCYwNQ8pEmKwNppWggBU",
        authDomain: "toptop-game-4e89f.firebaseapp.com",
        projectId: "toptop-game-4e89f",
        storageBucket: "toptop-game-4e89f.firebasestorage.app",
        messagingSenderId: "786973684229",
        appId: "1:786973684229:web:a327a180f44ca18f8fa26c",
        measurementId: "G-S6ERB47WJ8",
        databaseURL: "https://toptop-game-4e89f-default-rtdb.firebaseio.com/"
      };

      const app = initializeApp(firebaseConfig);
      window.db = getFirestore(app);
      window.firestoreFns = { doc, setDoc, getDoc, updateDoc };
    </script>

    <script>
        let currentUser = "";
        let totalCoins = 0;
        let p1Pos = 1;
        let p2Pos = 1;
        let isP1Turn = true;

        // Snakes and Ladders shortcuts map
        const snakesAndLadders = {
            3: 22, 5: 8, 11: 26, 20: 29, 17: 4, 19: 7, 27: 1, 21: 9, // Ladders & Snakes
            34: 54, 42: 63, 50: 19, 62: 18, 71: 92, 80: 99, 87: 24, 98: 78
        };

        window.onload = function() {
            let savedUser = localStorage.getItem("top_top_active_user");
            if (savedUser) {
                currentUser = savedUser;
                loadUserData();
                switchScreen("hubScreen");
            } else {
                switchScreen("authScreen");
            }
            createSnakeBoardUI();
        };

        function switchScreen(id) {
            document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
            document.getElementById(id).classList.add("active");
        }

        function switchAuthMode(mode) {
            document.getElementById('loginForm').style.display = mode === 'login' ? 'block' : 'none';
            document.getElementById('registerForm').style.display = mode === 'register' ? 'block' : 'none';
        }

        async function registerUser() {
            let name = document.getElementById("regUsername").value.trim();
            let pass = document.getElementById("regPassword").value.trim();
            if (!name || !pass) return alert("تکایە هەموو خانەکان پڕبکەرەوە!");
            
            const userRef = window.firestoreFns.doc(window.db, "users", name);
            await window.firestoreFns.setDoc(userRef, { username: name, password: pass, coins: 100, avatar: '👤' });
            localStorage.setItem("top_top_active_user", name);
            currentUser = name;
            loadUserData();
            switchScreen("hubScreen");
        }

        async function loginUser() {
            let name = document.getElementById("loginUsername").value.trim();
            let pass = document.getElementById("loginPassword").value.trim();
            const userRef = window.firestoreFns.doc(window.db, "users", name);
            const snap = await window.firestoreFns.getDoc(userRef);
            if (snap.exists() && snap.data().password === pass) {
                localStorage.setItem("top_top_active_user", name);
                currentUser = name;
                loadUserData();
                switchScreen("hubScreen");
            } else {
                alert("زانیارییەکان هەڵەن!");
            }
        }

        async function loadUserData() {
            if (!currentUser) return;
            const snap = await window.firestoreFns.getDoc(window.firestoreFns.doc(window.db, "users", currentUser));
            if (snap.exists()) {
                let data = snap.data();
                totalCoins = data.coins || 0;
                document.getElementById("hubUsernameText").innerText = currentUser;
                document.getElementById("hubTotalCoins").innerText = totalCoins;
                document.getElementById("hubUserAvatar").innerText = data.avatar || '👤';
            }
        }

        function openShopScreen() {
            switchScreen("shopScreen");
        }

        async function buyAvatar(emoji, cost) {
            if (totalCoins < cost) return alert("دراوی پێویستت نییە!");
            totalCoins -= cost;
            const userRef = window.firestoreFns.doc(window.db, "users", currentUser);
            await window.firestoreFns.updateDoc(userRef, { coins: totalCoins, avatar: emoji });
            loadUserData();
            alert("پێرۆزە! ئاڤاتارە نوێیەکەت چالاککرا 🥳");
        }

        /* --- Snakes and Ladders Game Logic --- */
        function createSnakeBoardUI() {
            let board = document.getElementById("snakeBoard");
            board.innerHTML = "";
            for (let i = 100; i >= 1; i--) {
                let cell = document.createElement("div");
                cell.className = "board-cell";
                cell.id = "cell-" + i;
                cell.innerText = i;
                board.appendChild(cell);
            }
            updateBoardTokens();
        }

        function openSnakeGameOption() {
            p1Pos = 1; p2Pos = 1; isP1Turn = true;
            updateBoardTokens();
            switchScreen("snakeGameScreen");
        }

        function rollSnakeDice() {
            if (!isP1Turn) return;
            
            let dice = Math.floor(Math.random() * 6) + 1;
            document.getElementById("diceDisplay").innerText = dice;

            if (p1Pos + dice <= 100) p1Pos += dice;
            if (snakesAndLadders[p1Pos]) p1Pos = snakesAndLadders[p1Pos];

            updateBoardTokens();

            if (p1Pos === 100) {
                setTimeout(() => alert("پیرۆزە! تۆ بڕیتەوە 🎉"), 300);
                return;
            }

            // Bot Turn Trigger
            isP1Turn = false;
            document.getElementById("snakeTurnText").innerText = "نۆرەی کۆمپیوتەرە... ⏳";
            setTimeout(botSnakeMove, 1200);
        }

        function botSnakeMove() {
            let dice = Math.floor(Math.random() * 6) + 1;
            document.getElementById("diceDisplay").innerText = dice;

            if (p2Pos + dice <= 100) p2Pos += dice;
            if (snakesAndLadders[p2Pos]) p2Pos = snakesAndLadders[p2Pos];

            updateBoardTokens();

            if (p2Pos === 100) {
                setTimeout(() => alert("دۆڕایت! کۆمپیوتەر بڕییەوە 🤖"), 300);
                return;
            }

            isP1Turn = true;
            document.getElementById("snakeTurnText").innerText = "نۆرەی تۆیە! 🎯";
        }

        function updateBoardTokens() {
            document.querySelectorAll(".player-token").forEach(t => t.remove());

            let c1 = document.getElementById("cell-" + p1Pos);
            let c2 = document.getElementById("cell-" + p2Pos);

            if (c1) {
                let t1 = document.createElement("div");
                t1.className = "player-token token-p1";
                c1.appendChild(t1);
            }

            if (c2) {
                let t2 = document.createElement("div");
                t2.className = "player-token token-p2";
                c2.appendChild(t2);
            }

            document.getElementById("p1PosText").innerText = p1Pos;
            document.getElementById("p2PosText").innerText = p2Pos;
        }
    </script>
</body>
</html>
