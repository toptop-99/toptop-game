<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تۆپ تۆپ - دۆمینەی ئۆنلاین (ئەزنیف)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        html, body {
            width: 100vw; height: 100vh; margin: 0; padding: 0;
            background-color: #0c0a09; color: #f8fafc;
            font-family: 'Noto Sans Arabic', sans-serif;
            overflow: hidden; touch-action: manipulation;
        }
        .container {
            width: 100vw; height: 100vh;
            background: linear-gradient(135deg, #1c1917, #0c0a09);
            display: flex; flex-direction: column; padding: 12px; position: relative; overflow: hidden;
        }
        .brand-title {
            text-align: center; font-size: 24px; font-weight: 900;
            background: linear-gradient(135deg, #f59e0b, #d97706, #b45309);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin: 2px 0 8px 0; filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.4));
        }
        .screen { display: none; flex: 1; flex-direction: column; height: 100%; overflow-y: auto; padding-bottom: 20px; }
        .screen.active { display: flex; }
        .form-group { margin-bottom: 10px; text-align: right; }
        label { display: block; font-size: 11px; margin-bottom: 4px; color: #fcd34d; }
        input, select {
            width: 100%; padding: 10px 12px; background: #27272a;
            border: 1px solid #d97706; border-radius: 10px; color: #fff;
            font-size: 13px; outline: none; font-family: 'Noto Sans Arabic', sans-serif;
        }
        .btn {
            width: 100%; background: linear-gradient(135deg, #d97706, #b45309);
            color: #ffffff; border: none; padding: 11px; font-size: 14px;
            font-weight: bold; border-radius: 10px; cursor: pointer; margin-top: 6px;
            box-shadow: 0 4px 12px rgba(217, 119, 6, 0.3); transition: transform 0.1s ease;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn:active { transform: scale(0.96); }
        
        .hub-header-panel {
            background: rgba(39, 39, 42, 0.95); border: 1px solid #d97706;
            border-radius: 14px; padding: 10px 14px; display: flex;
            justify-content: space-between; align-items: center; margin-bottom: 10px;
            box-shadow: 0 4px 15px rgba(217, 119, 6, 0.2);
        }
        .hub-user-info { display: flex; align-items: center; gap: 10px; }
        .hub-avatar-box {
            width: 38px; height: 38px; border-radius: 50%; background: #d97706;
            overflow: hidden; display: flex; justify-content: center; align-items: center;
            font-size: 14px; border: 2px solid #fcd34d;
        }
        .hub-coins-badge {
            background: rgba(217, 119, 6, 0.2); border: 1px solid #f59e0b;
            padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; color: #fbbf24;
        }

        .card {
            background: rgba(39, 39, 42, 0.85); border-radius: 12px;
            padding: 12px; margin-bottom: 10px; text-align: right;
            border: 1px solid #d97706; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        .tab-switcher { display: flex; gap: 4px; margin-bottom: 8px; }
        .tab-btn { flex: 1; background: #27272a; border: 1px solid #d97706; color: #fcd34d; padding: 7px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 12px; }
        .tab-btn.active { background: #d97706; color: #fff; box-shadow: 0 0 8px rgba(217, 119, 6, 0.4); }

        /* --- Domino Board Styles --- */
        .domino-board {
            flex: 1; background: #064e3b; border: 3px solid #059669; border-radius: 16px;
            position: relative; display: flex; flex-direction: column; justify-content: space-between;
            padding: 10px; overflow: hidden; box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
        }
        .player-zone {
            display: flex; justify-content: center; align-items: center; gap: 6px;
            min-height: 60px; background: rgba(0,0,0,0.2); border-radius: 10px; padding: 5px;
        }
        .table-center {
            flex: 1; display: flex; justify-content: center; align-items: center;
            gap: 8px; overflow-x: auto; padding: 10px 0;
        }
        .domino-tile {
            width: 34px; height: 60px; background: #f8fafc; border: 2px solid #000;
            border-radius: 6px; display: flex; flex-direction: column;
            justify-content: space-between; align-items: center; padding: 3px 0;
            box-shadow: 2px 4px 8px rgba(0,0,0,0.5); cursor: pointer; color: #000; font-weight: bold; font-size: 14px;
        }
        .domino-tile.horizontal {
            width: 60px; height: 34px; flex-direction: row; padding: 0 3px;
        }
        .tile-divider { width: 80%; height: 2px; background: #000; }
        .tile-divider.vert { width: 2px; height: 80%; }
        .my-hand { display: flex; gap: 6px; overflow-x: auto; padding: 6px 0; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Auth Screen -->
        <div id="authScreen" class="screen active">
            <div class="brand-title">تۆپ تۆپ (دۆمینە)</div>
            <div class="card">
                <div class="tab-switcher">
                    <button class="tab-btn active" id="loginTabBtn" onclick="switchAuthMode('login')">چوونەژوورەوە</button>
                    <button class="tab-btn" id="registerTabBtn" onclick="switchAuthMode('register')">حیسابی نوێ</button>
                </div>

                <div id="registerForm" style="display: none;">
                    <div class="form-group">
                        <label>ناوی بەکارهێنەر</label>
                        <input type="text" id="regUsername" placeholder="ناوی بەکارهێنەر...">
                    </div>
                    <div class="form-group">
                        <label>وشەی نهێنی</label>
                        <input type="password" id="regPassword" placeholder="وشەی نهێنی...">
                    </div>
                    <button class="btn" onclick="registerUser()">دروستکردنی حیساب</button>
                </div>

                <div id="loginForm">
                    <div class="form-group">
                        <label>ناوی بەکارهێنەر</label>
                        <input type="text" id="loginUsername" placeholder="ناوی بەکارهێنەر...">
                    </div>
                    <div class="form-group">
                        <label>وشەی نهێنی</label>
                        <input type="password" id="loginPassword" placeholder="وشەی نهێنی...">
                    </div>
                    <button class="btn" onclick="loginUser()">چوونەژوورەوە</button>
                </div>
            </div>
        </div>

        <!-- Hub Screen -->
        <div id="hubScreen" class="screen">
            <div class="brand-title">تۆپ تۆپ</div>
            
            <div class="hub-header-panel">
                <div class="hub-user-info">
                    <div class="hub-avatar-box" id="hubUserAvatar">👤</div>
                    <div>
                        <span id="hubUsernameText" style="font-weight: bold; color: #fbbf24; font-size: 14px;"></span>
                    </div>
                </div>
                <div class="hub-coins-badge">💰 <span id="hubTotalCoins">0</span></div>
            </div>

            <div class="card" style="text-align: center; padding: 20px;">
                <h2 style="color: #fbbf24; margin-top: 0;">🀏 دۆمینەی ئۆنلاین (ئەزنیف)</h2>
                <p style="font-size: 12px; color: #d6d3d1;">ڕاستەوخۆ لەگەڵ یاریزانانی ئۆنلاین یاری بکە و کۆین ببەرەوە!</p>
                <button class="btn" style="font-size: 16px; padding: 14px;" onclick="joinOnlineDominoGame()">🎮 چوونە ناو یاری ئۆنلاین</button>
            </div>
        </div>

        <!-- Domino Game Screen -->
        <div id="dominoGameScreen" class="screen">
            <div class="hub-header-panel" style="margin-bottom: 6px;">
                <button class="btn" style="width: auto; padding: 5px 10px; margin: 0; background: #3f3f46; font-size: 11px;" onclick="exitDominoGame()">⬅️ دەرچوون</button>
                <span id="gameStatusText" style="font-size: 12px; color: #fbbf24; font-weight: bold;">چاوەڕێی یاریزانی دووەم...</span>
            </div>

            <div class="domino-board">
                <!-- Opponent Hand -->
                <div class="player-zone" id="opponentZone">
                    <span style="font-size: 12px; color: #a1a1aa;">ڕکابەر (🀏 7 بەرد)</span>
                </div>

                <!-- Table Center -->
                <div class="table-center" id="dominoTable">
                    <span style="color: rgba(255,255,255,0.4); font-size: 12px;">مێزی یاری بەتاڵە</span>
                </div>

                <!-- My Hand -->
                <div>
                    <div style="font-size: 11px; color: #fcd34d; margin-bottom: 4px; text-align: right;">بەردەکانی تۆ:</div>
                    <div class="my-hand" id="myHandZone"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
      import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
      import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDfrFkglZShCuZhCYwNQ8pEmKwNppWggBU",
        authDomain: "toptop-game-4e89f.firebaseapp.com",
        projectId: "toptop-game-4e89f",
        storageBucket: "toptop-game-4e89f.firebasestorage.app",
        messagingSenderId: "786973684229",
        appId: "1:786973684229:web:a327a180f44ca18f8fa26c",
        measurementId: "G-S6ERB47WJ8",
        databaseURL: "https://toptop-game-4e89f-default-rtdb.firebaseio.com/"
      };

      const app = initializeApp(firebaseConfig);
      window.db = getFirestore(app);
      window.rtdb = getDatabase(app);
      window.firestoreFns = { doc, setDoc, getDoc };
      window.rtdbFns = { ref, set, onValue, update };
    </script>

    <script>
        let currentUser = "";
        let totalCoins = 0;
        let currentGameRoom = "room_1";
        let myHand = [];

        window.onload = function() {
            let savedUser = localStorage.getItem("top_top_active_user");
            if (savedUser) {
                currentUser = savedUser;
                loadUserData();
                switchScreen("hubScreen");
            } else {
                switchScreen("authScreen");
            }
        };

        function switchScreen(id) {
            document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
            document.getElementById(id).classList.add("active");
        }

        function switchAuthMode(mode) {
            document.getElementById('loginForm').style.display = mode === 'login' ? 'block' : 'none';
            document.getElementById('registerForm').style.display = mode === 'register' ? 'block' : 'none';
        }

        async function registerUser() {
            let name = document.getElementById("regUsername").value.trim();
            let pass = document.getElementById("regPassword").value.trim();
            if (!name || !pass) return alert("تکایە هەموو خانەکان پڕبکەرەوە!");
            
            const userRef = window.firestoreFns.doc(window.db, "users", name);
            await window.firestoreFns.setDoc(userRef, { username: name, password: pass, coins: 100 });
            localStorage.setItem("top_top_active_user", name);
            currentUser = name;
            loadUserData();
            switchScreen("hubScreen");
        }

        async function loginUser() {
            let name = document.getElementById("loginUsername").value.trim();
            let pass = document.getElementById("loginPassword").value.trim();
            const userRef = window.firestoreFns.doc(window.db, "users", name);
            const snap = await window.firestoreFns.getDoc(userRef);
            if (snap.exists() && snap.data().password === pass) {
                localStorage.setItem("top_top_active_user", name);
                currentUser = name;
                loadUserData();
                switchScreen("hubScreen");
            } else {
                alert("زانیارییەکان هەڵەن!");
            }
        }

        async function loadUserData() {
            if (!currentUser) return;
            const snap = await window.firestoreFns.getDoc(window.firestoreFns.doc(window.db, "users", currentUser));
            if (snap.exists()) {
                totalCoins = snap.data().coins || 0;
                document.getElementById("hubUsernameText").innerText = currentUser;
                document.getElementById("hubTotalCoins").innerText = totalCoins;
            }
        }

        // --- Domino Online Multiplayer Logic ---
        function generateDominoSet() {
            let tiles = [];
            for (let i = 0; i <= 6; i++) {
                for (let j = i; j <= 6; j++) {
                    tiles.push([i, j]);
                }
            }
            return tiles.sort(() => Math.random() - 0.5);
        }

        function joinOnlineDominoGame() {
            switchScreen("dominoGameScreen");
            let roomRef = window.rtdbFns.ref(window.rtdb, 'dominoRooms/' + currentGameRoom);

            window.rtdbFns.onValue(roomRef, (snapshot) => {
                let data = snapshot.val();
                if (!data) {
                    let tiles = generateDominoSet();
                    let p1Hand = tiles.splice(0, 7);
                    let p2Hand = tiles.splice(0, 7);
                    
                    window.rtdbFns.set(roomRef, {
                        p1: currentUser,
                        p2: "",
                        p1Hand: p1Hand,
                        p2Hand: p2Hand,
                        table: [],
                        turn: currentUser
                    });
                    myHand = p1Hand;
                } else if (data.p1 !== currentUser && !data.p2) {
                    window.rtdbFns.update(roomRef, { p2: currentUser });
                    myHand = data.p2Hand;
                } else {
                    myHand = (data.p1 === currentUser) ? data.p1Hand : data.p2Hand;
                }
                renderBoard(data);
            });
        }

        function renderBoard(data) {
            if (!data) return;
            let statusText = document.getElementById("gameStatusText");
            if (!data.p2) {
                statusText.innerText = "چاوەڕێی یاریزانی دووەم...";
            } else {
                statusText.innerText = (data.turn === currentUser) ? "نۆرەی تۆیە! 🎯" : "نۆرەی ڕکابەرەکەتە ⏳";
            }

            // Render Table Tiles
            let tableEl = document.getElementById("dominoTable");
            tableEl.innerHTML = "";
            if (data.table && data.table.length > 0) {
                data.table.forEach(tile => {
                    tableEl.appendChild(createDominoUI(tile[0], tile[1], true));
                });
            } else {
                tableEl.innerHTML = `<span style="color: rgba(255,255,255,0.4); font-size: 12px;">مێزی یاری بەتاڵە</span>`;
            }

            // Render My Hand
            let myHandEl = document.getElementById("myHandZone");
            myHandEl.innerHTML = "";
            if (myHand) {
                myHand.forEach((tile, index) => {
                    let tileUI = createDominoUI(tile[0], tile[1], false);
                    tileUI.onclick = () => playTile(tile, index, data);
                    myHandEl.appendChild(tileUI);
                });
            }
        }

        function createDominoUI(top, bottom, isHorizontal) {
            let tile = document.createElement("div");
            tile.className = "domino-tile" + (isHorizontal ? " horizontal" : "");
            tile.innerHTML = `<span>${top}</span><div class="tile-divider ${isHorizontal ? 'vert' : ''}"></div><span>${bottom}</span>`;
            return tile;
        }

        function playTile(tile, index, data) {
            if (data.turn !== currentUser) return alert("نۆرەی تۆ نیست!");
            
            let table = data.table || [];
            table.push(tile);
            myHand.splice(index, 1);

            let nextTurn = (data.p1 === currentUser) ? data.p2 : data.p1;
            let updateData = { table: table, turn: nextTurn };
            
            if (data.p1 === currentUser) updateData.p1Hand = myHand;
            else updateData.p2Hand = myHand;

            window.rtdbFns.update(window.rtdbFns.ref(window.rtdb, 'dominoRooms/' + currentGameRoom), updateData);
        }

        function exitDominoGame() {
            switchScreen("hubScreen");
        }
    </script>
</body>
</html>
